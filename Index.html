<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja strona</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #222;
            color: white;
            padding: 30px;
        }

        main {
            padding: 40px;
        }

        .box {
            background: white;
            padding: 25px;
            margin: auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<header>
    <h1>Witaj na mojej stronie</h1>
</header>

<main>
    <div class="box">
        <h2>Moja pierwsza strona</h2>
        <p>
            To jest przykładowa strona internetowa wykonana w HTML.
        </p>

        <button onclick="alert('Dziękuję za odwiedzenie strony!')">
            Kliknij tutaj
        </button>
    </div>
</main>

</body>
</html>
